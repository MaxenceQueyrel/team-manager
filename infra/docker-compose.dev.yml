services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: bun run dev --host

  backend:
    build:
      context: ..                  # repo root — needs optimizer/ and backend/ both
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ../optimizer:/app/optimizer
      - ../backend:/app/backend
      - ../backend/data:/app/backend/data
    environment:
      - DATA_DIR=/app/backend/data
      - CORS_ORIGINS=http://localhost:3000
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://team_manager:team_manager@postgres:5432/team_manager
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=team_manager
      - POSTGRES_PASSWORD=team_manager
      - POSTGRES_DB=team_manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
